<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#primaryGrad)" filter="url(#dropShadow)"/>

  <!-- Top Shine Highlight -->
  <path d="M 32 144 C 32 82.13 82.13 32 144 32 L 368 32 C 429.87 32 480 82.13 480 144 L 480 200 C 350 180 160 220 32 280 Z" fill="url(#shineGrad)" clip-path="url(#clipSquircle)"/>

  <!-- Newspaper / Document Glyph (Scales 24x24 to 512x512) -->
  <g transform="translate(136, 116) scale(10)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main document body -->
    <path d="M5 4 H15 L20 9 V20 H5 Z" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          fill="#FFFFFF" 
          fill-opacity="0.08"/>
    
    <!-- Folded corner tab -->
    <path d="M15 4 V9 H20 Z" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          fill="#FFFFFF" 
          fill-opacity="0.25"/>

    <!-- Article headline / crease lines -->
    <line x1="8.5" y1="12" x2="15.5" y2="12" stroke="#FFFFFF" stroke-width="1.6" opacity="0.95"/>
    <line x1="8.5" y1="15" x2="15.5" y2="15" stroke="#FFFFFF" stroke-width="1.6" opacity="0.75"/>
    <line x1="8.5" y1="18" x2="13" y2="18" stroke="#FFFFFF" stroke-width="1.6" opacity="0.55"/>
  </g>
</svg>